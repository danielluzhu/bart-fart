<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e14">
<title>bart-fart — live BART train tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚇</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0a0e14;
    --panel: rgba(13, 18, 26, .78);
    --panel-border: rgba(255, 255, 255, .08);
    --text: #e6edf5;
    --muted: #8b98a9;
    --live: #34d399;
    --accent: #0099d8; /* BART blue */
  }
  body.view-day {
    --panel: rgba(250, 252, 255, .82);
    --panel-border: rgba(20, 40, 70, .12);
    --text: #17222e;
    --muted: #5d6b7a;
    --live: #059669;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { font-family: 'Space Grotesk', -apple-system, 'Segoe UI', sans-serif; }
  #map { position: fixed; inset: 0; background: var(--bg); }
  body.view-day #map { background: #dfe3e8; }
  .tiles-day { filter: grayscale(.85) brightness(1.03); }

  /* ---------- floating glass header ---------- */
  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 1000;
    display: flex; flex-direction: column; gap: 10px;
    max-width: calc(100vw - 28px);
  }
  .glass {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    box-shadow: 0 8px 32px rgba(0, 0, 0, .45);
  }
  body.view-day .glass { box-shadow: 0 8px 28px rgba(30, 50, 80, .18); }
  #title-card { display: flex; align-items: center; gap: 14px; padding: 12px 18px; flex-wrap: wrap; }
  #title-card h1 {
    margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .5px; color: var(--text);
    display: flex; align-items: center;
  }
  #title-card h1 em { font-style: normal; color: var(--accent); }
  body.view-day #title-card h1 em { color: #0077b0; }
  /* homage to the BART "ba" roundel */
  .roundel {
    display: inline-flex; align-items: center; justify-content: center;
    width: 27px; height: 27px; border-radius: 50%; flex: none;
    background: #0099d8; color: #fff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-style: italic; font-weight: 700; font-size: 13px; letter-spacing: 0;
    padding-right: 2px; margin-right: 10px;
    box-shadow: 0 0 12px rgba(0, 153, 216, .55);
  }
  #live-pill {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 500; letter-spacing: .18em; color: var(--live);
  }
  #live-pill i {
    width: 8px; height: 8px; border-radius: 50%; background: var(--live);
    box-shadow: 0 0 8px var(--live);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, .6); }
    70% { box-shadow: 0 0 0 9px rgba(52, 211, 153, 0); }
    100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
  }
  #status { font-size: 13px; color: var(--muted); white-space: nowrap; }
  #status b { color: var(--text); font-weight: 500; }
  #views { display: flex; gap: 2px; background: rgba(128,128,128,.14); border-radius: 999px; padding: 3px; }
  #views button {
    font-family: inherit; font-size: 11px; font-weight: 500; letter-spacing: .12em;
    color: var(--muted); background: none; border: none; border-radius: 999px;
    padding: 4px 12px; cursor: pointer;
  }
  #views button.on { color: var(--text); background: var(--panel); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  #locate {
    font-family: inherit; font-size: 11px; font-weight: 500; letter-spacing: .12em;
    color: var(--text); background: rgba(128, 128, 128, .14);
    border: 1px solid var(--panel-border); border-radius: 999px;
    padding: 5px 12px; cursor: pointer;
  }
  #locate:hover { background: rgba(128, 128, 128, .24); }
  #locate.busy { color: var(--muted); cursor: wait; animation: locating 1s ease-in-out infinite; }
  @keyframes locating { 50% { opacity: .4; } }
  body.view-board #locate { display: none; }

  /* the "you are here" dot */
  .you-marker { z-index: 950 !important; }
  .you-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: #38bdf8; border: 2.5px solid #fff;
    box-shadow: 0 0 12px #38bdf8;
  }
  .you-dot::after {
    content: ''; position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid rgba(56, 189, 248, .8);
    animation: you-pulse 2s ease-out infinite;
  }
  @keyframes you-pulse {
    0% { transform: scale(.6); opacity: 1; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  #lines { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 14px; }
  body.view-board #lines { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 500; color: var(--text);
    background: rgba(128, 128, 128, .09);
    border: 1px solid var(--panel-border);
    border-radius: 999px; padding: 4px 11px;
  }
  .chip i {
    width: 9px; height: 9px; border-radius: 50%; display: inline-block;
    box-shadow: 0 0 7px currentColor;
  }
  .chip span { color: var(--muted); font-weight: 400; }

  /* ---------- loading overlay ---------- */
  #loading {
    position: fixed; inset: 0; z-index: 2000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: #0a0e14; color: #e6edf5;
    transition: opacity .8s;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .radar {
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid rgba(0, 153, 216, .9);
    position: relative;
    animation: radar 1.8s ease-out infinite;
  }
  #loading .radar::after {
    content: ''; position: absolute; inset: 22px; border-radius: 50%;
    background: #0099d8; box-shadow: 0 0 18px #0099d8;
  }
  @keyframes radar {
    0% { box-shadow: 0 0 0 0 rgba(0, 153, 216, .45); }
    100% { box-shadow: 0 0 0 44px rgba(0, 153, 216, 0); }
  }
  #loading h1 { font-size: 26px; margin: 0; letter-spacing: .5px; }
  #loading h1 em { font-style: normal; color: #0099d8; }
  #loading p { margin: 0; color: #8b98a9; font-size: 14px; letter-spacing: .12em; }

  /* ---------- map furniture ---------- */
  .leaflet-container { font-family: inherit; }
  .leaflet-overlay-pane svg { filter: drop-shadow(0 0 5px rgba(0, 0, 0, .9)); }
  body.view-day .leaflet-overlay-pane svg { filter: drop-shadow(0 1px 3px rgba(30, 50, 80, .35)); }
  .leaflet-control-zoom { border: none !important; box-shadow: 0 8px 24px rgba(0,0,0,.5) !important; }
  .leaflet-control-zoom a {
    background: var(--panel) !important; color: var(--text) !important;
    border: 1px solid var(--panel-border) !important;
    backdrop-filter: blur(10px);
  }
  .leaflet-control-attribution {
    background: var(--panel) !important; color: var(--muted) !important;
    backdrop-filter: blur(6px); font-size: 10px !important;
  }
  .leaflet-control-attribution a { color: var(--muted) !important; }

  /* permanent labels for key stations (airports, termini) */
  .stn-label {
    background: none !important; border: none !important; box-shadow: none !important;
    padding: 0 !important; margin: 0;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10.5px; font-weight: 700; letter-spacing: .05em;
    color: #dce7f3;
    text-shadow: 0 0 6px rgba(0, 0, 0, .95), 0 1px 3px rgba(0, 0, 0, .9);
  }
  .stn-label::before { display: none; }
  .stn-label.air {
    color: #4fc3f7;
    text-shadow: 0 0 8px rgba(0, 153, 216, .55), 0 1px 3px rgba(0, 0, 0, .9);
  }
  body.view-day .stn-label {
    color: #1c2836;
    text-shadow: 0 0 5px rgba(255, 255, 255, .95), 0 1px 2px rgba(255, 255, 255, .9);
  }
  body.view-day .stn-label.air { color: #0077b0; }

  .stn-tip {
    background: var(--panel) !important; color: var(--text) !important;
    border: 1px solid var(--panel-border) !important; border-radius: 12px !important;
    backdrop-filter: blur(14px);
    font-size: 12px; font-family: inherit; padding: 10px 12px !important;
    box-shadow: 0 10px 30px rgba(0,0,0,.55) !important;
  }
  .stn-tip::before { display: none; }
  .board { min-width: 190px; }
  .board-title { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .board-empty { color: var(--muted); }
  .board-sec {
    margin: 8px 0 3px; font-size: 10px; font-weight: 500;
    letter-spacing: .16em; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .board-sec::after { content: ''; flex: 1; height: 1px; background: rgba(128,128,128,.25); }
  .board-row { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
  .board-row i {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    box-shadow: 0 0 6px currentColor;
  }
  .board-dest { flex: 1; padding-right: 10px; white-space: nowrap; }
  .board-mins { color: var(--muted); white-space: nowrap; }
  .board-mins b { color: var(--text); font-weight: 500; }

  .leaflet-popup-content-wrapper {
    background: var(--panel) !important; color: var(--text) !important;
    border: 1px solid var(--panel-border);
    border-radius: 14px !important;
    backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px rgba(0,0,0,.55) !important;
  }
  .leaflet-popup-tip { background: var(--panel) !important; }
  .leaflet-popup-close-button { color: var(--muted) !important; }
  .leaflet-popup-content { font-size: 13px; line-height: 1.6; margin: 14px 18px !important; font-family: inherit; }
  .popup-dest { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .popup-dest i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px currentColor; flex: none; }
  .popup-sub { color: var(--muted); }
  .board-code {
    margin-left: 8px; font-size: 10px; font-weight: 500; letter-spacing: .12em;
    color: var(--muted); border: 1px solid var(--panel-border); border-radius: 5px;
    padding: 1px 5px; vertical-align: 1px;
  }
  .popup-lines {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    margin-top: 9px; padding-top: 8px; border-top: 1px solid rgba(128,128,128,.25);
  }
  .popup-line {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 500; letter-spacing: .1em; color: var(--muted);
  }
  .popup-line i {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
    box-shadow: 0 0 6px currentColor;
  }
  .popup-you { margin-top: 7px; font-size: 11px; letter-spacing: .04em; color: #38bdf8; }
  body.view-day .popup-you { color: #0077b0; }
  .popup-sub b { color: var(--text); font-weight: 500; }
  .popup-late { color: #fb923c; }

  /* ---------- trains ---------- */
  .train-marker { transition: transform 1.6s cubic-bezier(.45, 0, .3, 1); }
  .leaflet-zoom-anim .train-marker { transition: none; }
  .train-zoom { width: 13px; height: 30px; transition: transform .2s; animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  .train-marker:hover .train-zoom { transform: scale(1.35); }
  .train-marker:hover { z-index: 900 !important; }
  .train-wrap { position: relative; width: 13px; height: 30px; transition: transform 1.6s cubic-bezier(.45, 0, .3, 1); }
  .leaflet-zoom-anim .train-wrap { transition: none; }
  .train-svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* ---------- fart plumes ---------- */
  .puff-marker { pointer-events: none; }
  .puff {
    width: 30px; height: 19px;
    animation: puff-drift 2.4s ease-out forwards;
  }
  /* scalloped cartoon cloud + trailing bubbles; rotated so the bubbles
     point back toward the train that emitted it */
  .puff svg {
    width: 100%; height: 100%; overflow: visible;
    animation: puff-wobble .45s ease-in-out infinite alternate;
  }
  .puff path, .puff circle {
    fill: rgba(178, 224, 124, .92);
    stroke: #4a7c2f; stroke-width: 2; stroke-linejoin: round;
  }
  body.view-day .puff path, body.view-day .puff circle {
    fill: rgba(158, 206, 104, .95); stroke: #3c6423;
  }
  @keyframes puff-drift {
    0% { transform: translate(0, 0) scale(.3); opacity: 1; }
    70% { opacity: .85; }
    100% { transform: translate(var(--dx), var(--dy)) scale(var(--s)); opacity: 0; }
  }
  @keyframes puff-wobble {
    from { transform: rotate(var(--rot, 0deg)) scale(1, 1); }
    to { transform: rotate(var(--rot, 0deg)) scale(1.08, .88); }
  }

  /* ---------- split-flap departures hall ---------- */
  #hall {
    position: fixed; inset: 0; z-index: 800; display: none;
    overflow: auto;
    background:
      radial-gradient(120% 90% at 50% 0%, #12263a 0%, #0b1622 45%, #060b11 100%);
    color: #dbe6f0;
    font-family: 'Oswald', 'Space Grotesk', sans-serif;
  }
  body.view-board #hall { display: block; }
  #hall-inner { max-width: 1060px; margin: 0 auto; padding: 96px 24px 48px; }
  #hall-head {
    text-align: center; margin-bottom: 26px;
    border-top: 3px double #2e4a63; border-bottom: 3px double #2e4a63;
    padding: 14px 0 16px;
  }
  #hall-head .arr {
    font-size: 13px; letter-spacing: .55em; color: #7fa3c0; text-indent: .55em;
  }
  #hall-head h2 {
    margin: 6px 0 2px; font-size: 44px; font-weight: 600; letter-spacing: .14em;
    color: #eef5fb; text-indent: .14em;
    text-shadow: 0 0 22px rgba(0, 153, 216, .35);
  }
  #hall-sub { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 8px; }
  #stn-pick {
    font-family: inherit; font-size: 16px; letter-spacing: .1em;
    color: #4fc3f7; background: #0e1d2c; border: 1px solid #2e4a63; border-radius: 6px;
    padding: 6px 12px; cursor: pointer;
  }
  #stn-pick:focus { outline: 2px solid #0099d855; }
  #hall-clock {
    font-size: 16px; letter-spacing: .18em; color: #7fa3c0;
    font-variant-numeric: tabular-nums;
  }
  #flap-frame {
    background: #0a141e; border: 1px solid #24384c; border-radius: 10px;
    padding: 18px 20px 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,.7), inset 0 0 60px rgba(0,0,0,.55);
  }
  .fcols {
    display: flex; gap: 8px; align-items: center;
    padding: 0 2px 10px; margin-bottom: 12px;
    border-bottom: 1px solid #24384c;
    font-size: 12px; letter-spacing: .3em; color: #6c8ba6;
  }
  .frow { display: flex; gap: 8px; align-items: center; padding: 5px 2px; }
  .fpill {
    width: 14px; height: 30px; border-radius: 3px; flex: none;
    background: var(--c, #1b2733);
    box-shadow: 0 0 10px color-mix(in srgb, var(--c, transparent) 55%, transparent);
  }
  .fgroup { display: flex; gap: 3px; }
  .fcell {
    width: 26px; height: 34px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; font-weight: 500; color: #eef4f9;
    background: linear-gradient(#333a42 0%, #262c33 48%, #1e242a 52%, #161b20 100%);
    border-radius: 3px;
    position: relative;
    box-shadow: inset 0 -2px 4px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.05);
  }
  .fcell::after {
    content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    background: rgba(0, 0, 0, .75);
  }
  .fcell.flipping { animation: flap .09s linear; }
  @keyframes flap {
    0% { transform: scaleY(1); filter: brightness(1); }
    50% { transform: scaleY(.12); filter: brightness(1.6); }
    100% { transform: scaleY(1); filter: brightness(1); }
  }
  /* direction: an enamel-sign badge, deliberately unlike the flap cells */
  .fdir {
    width: 96px; height: 30px; flex: none;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 13px; font-weight: 500; letter-spacing: .18em; text-indent: .18em;
    color: #4fc3f7;
    border: 1px solid #2e4a63; border-radius: 999px;
    background: rgba(0, 153, 216, .08);
    text-shadow: 0 0 10px rgba(79, 195, 247, .35);
  }
  .fdir:empty { opacity: 0; }
  /* minutes: one wide flap plate, not per-digit cells */
  .fmin {
    width: 84px; font-variant-numeric: tabular-nums; letter-spacing: .08em;
  }
  .sp { flex: 1; min-width: 6px; }
  #hall-foot {
    text-align: center; margin-top: 20px;
    font-size: 11px; letter-spacing: .3em; color: #456580;
  }
  @media (max-width: 900px) {
    .fcell { width: 19px; height: 27px; font-size: 15px; }
    .fdir { width: 70px; font-size: 10px; gap: 4px; }
    .fmin { width: 58px; }
    #hall-head h2 { font-size: 30px; }
    #hall-inner { padding-top: 120px; }
  }
</style>
</head>
<body>
<div id="loading">
  <div class="radar"></div>
  <h1>bart-<em>fart</em></h1>
  <p>TRIANGULATING TRAINS…</p>
</div>
<div id="hud">
  <div id="title-card" class="glass">
    <h1><span class="roundel">bf</span>bart-<em>fart</em></h1>
    <div id="live-pill"><i></i>LIVE</div>
    <div id="status">warming up…</div>
    <div id="views">
      <button data-v="neon">NEON</button>
      <button data-v="day">DAY</button>
      <button data-v="board">DEPARTURES</button>
    </div>
    <button id="locate" title="Zoom to my location and the nearest station">📍 NEAR ME</button>
  </div>
  <div id="lines" class="glass" hidden></div>
</div>
<div id="map"></div>
<div id="hall">
  <div id="hall-inner">
    <div id="hall-head">
      <div class="arr">SAN FRANCISCO BAY AREA RAPID TRANSIT</div>
      <h2>DEPARTURES</h2>
      <div id="hall-sub">
        <select id="stn-pick" aria-label="Station"></select>
        <div id="hall-clock">--:--:--</div>
      </div>
    </div>
    <div id="flap-frame">
      <div class="fcols"></div>
      <div id="frows"></div>
    </div>
    <div id="hall-foot">LIVE FROM API.BART.GOV · UPDATES EVERY 15 SECONDS</div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-polylineoffset@1.1.1/leaflet.polylineoffset.js"></script>
<script src="core.js"></script>
<script>
/* ================= map setup ================= */
const map = L.map('map', { zoomControl: false, zoomSnap: .5 }).setView([37.72, -122.28], 11);
L.control.zoom({ position: 'bottomright' }).addTo(map);
const tilesNeon = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Esri &copy; OpenStreetMap contributors | data: BART', maxZoom: 16,
});
const tilesNeonRef = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16, opacity: .75,
});
const tilesDay = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors | data: BART', maxZoom: 18, className: 'tiles-day',
});

/* ================= view switching ================= */
const VIEWS = ['neon', 'day', 'board'];
let view = null;
function applyView(v) {
  if (!VIEWS.includes(v)) v = 'neon';
  view = v;
  document.body.className = 'view-' + v;
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  const wantDay = v === 'day';
  if (wantDay) { map.removeLayer(tilesNeon); map.removeLayer(tilesNeonRef); tilesDay.addTo(map); }
  else { map.removeLayer(tilesDay); tilesNeon.addTo(map); tilesNeonRef.addTo(map); }
  try { localStorage.setItem('bart-fart-view', v); } catch (e) {}
  if (v === 'board') { hallAutoSelect(); renderHall(); }
}
document.querySelectorAll('#views button').forEach(b => b.onclick = () => applyView(b.dataset.v));

/* ================= network drawing ================= */
const COLOR_ORDER = ['YELLOW', 'ORANGE', 'GREEN', 'RED', 'BLUE', 'GREY'];
const LINE_SPACING = 4; // px between parallel lines

function drawNetwork(net) {
  const stn = net.stations;
  // Group track segments (station pairs) by the set of line colors serving
  // them, then draw one polyline per color per segment, offset sideways so
  // shared corridors (Market St, the East Bay trunk) show every line.
  const segs = new Map();
  for (const r of net.routes) {
    for (let i = 1; i < r.stations.length; i++) {
      let [a, b] = [r.stations[i - 1], r.stations[i]];
      if (a === b) continue;
      // South-to-north so a color's sideways offset keeps its side of the corridor.
      if (stn[a].lat > stn[b].lat) [a, b] = [b, a];
      const key = `${a}|${b}`;
      if (!segs.has(key)) segs.set(key, { a, b, colors: new Map() });
      segs.get(key).colors.set(r.color, r.hexcolor);
    }
  }
  for (const seg of segs.values()) {
    const colors = [...seg.colors.keys()].sort((x, y) => COLOR_ORDER.indexOf(x) - COLOR_ORDER.indexOf(y));
    colors.forEach((color, i) => {
      const pts = [[stn[seg.a].lat, stn[seg.a].lon], [stn[seg.b].lat, stn[seg.b].lon]];
      L.polyline(pts, {
        color: seg.colors.get(color), weight: 2.5, opacity: .95,
        offset: (i - (colors.length - 1) / 2) * LINE_SPACING,
      }).addTo(map);
    });
  }
  // Key stations get bigger beads and permanent labels: airports (by name)
  // and line termini (first/last station of each route).
  const termini = new Set();
  for (const r of net.routes) {
    termini.add(r.stations[0]);
    termini.add(r.stations[r.stations.length - 1]);
  }
  const AIRPORT_SHORT = { SFIA: 'SFO', OAKL: 'OAK' };
  for (const s of Object.values(net.stations)) {
    const isAirport = /airport/i.test(s.name);
    const isKey = isAirport || termini.has(s.abbr);
    const bead = L.circleMarker([s.lat, s.lon], isAirport ? {
      radius: 4.5, color: '#0099d8', weight: 2,
      fillColor: '#0b1017', fillOpacity: 1, interactive: false,
    } : isKey ? {
      radius: 4, color: '#fff', weight: 1.75,
      fillColor: '#0b1017', fillOpacity: 1, interactive: false,
    } : {
      radius: 2.5, color: 'rgba(230, 240, 255, .85)', weight: 1.25,
      fillColor: '#0b1017', fillOpacity: 1, interactive: false,
    }).addTo(map);
    if (isKey) {
      const label = isAirport ? `✈ ${AIRPORT_SHORT[s.abbr] || s.name}` : s.name;
      bead.bindTooltip(label, {
        permanent: true, direction: 'right', offset: [7, 0], opacity: 1,
        className: 'stn-label' + (isAirport ? ' air' : ''),
      });
    }
    // Separate invisible, larger hit target so the tiny bead is easy to hover.
    L.circleMarker([s.lat, s.lon], { radius: 10, stroke: false, fillOpacity: 0 })
      .bindTooltip(() => stationBoard(s), { className: 'stn-tip', direction: 'top', offset: [0, -8], opacity: 1 })
      .addTo(map);
  }
  fitAll();
}

// fitBounds on a zero-size container clamps to max zoom, so wait for real
// dimensions (e.g. the page loading in a hidden or not-yet-sized tab).
let fitted = false;
function fitAll() {
  if (!network || fitted) return;
  const sz = map.getSize();
  if (!sz.x || !sz.y) return;
  map.fitBounds(L.latLngBounds(Object.values(network.stations).map(s => [s.lat, s.lon])), { padding: [30, 30] });
  fitted = true;
}
map.on('resize', fitAll);

/* ================= locate me ================= */
let you = null; // { lat, lon, nearestAbbr, km }
let youMarker = null;
const locateBtn = document.getElementById('locate');
locateBtn.onclick = () => locate();

function locate() {
  if (!network) return;
  if (!('geolocation' in navigator)) {
    document.getElementById('status').textContent = '⚠ geolocation not supported';
    return;
  }
  locateBtn.classList.add('busy');
  navigator.geolocation.getCurrentPosition((pos) => {
    locateBtn.classList.remove('busy');
    const here = [pos.coords.latitude, pos.coords.longitude];
    let best = null, bestM = Infinity;
    for (const s of Object.values(network.stations)) {
      const d = map.distance(here, [s.lat, s.lon]);
      if (d < bestM) { bestM = d; best = s; }
    }
    you = { lat: here[0], lon: here[1], nearestAbbr: best.abbr, km: bestM / 1000 };
    if (youMarker) youMarker.remove();
    youMarker = L.marker(here, {
      icon: L.divIcon({ className: 'you-marker', iconSize: [14, 14], iconAnchor: [7, 7], html: '<div class="you-dot"></div>' }),
      interactive: false, zIndexOffset: 700,
    }).addTo(map);
    if (view === 'board') { hallAutoSelect(); renderHall(); } // reflect nearest in the hall too
    stnPopupStation = best;
    stnPopup = L.popup({ offset: [0, -6], autoPan: false })
      .setLatLng([best.lat, best.lon]).setContent(stationPopupHtml(best)).openOn(map);
    map.flyToBounds(L.latLngBounds([here, [best.lat, best.lon]]), {
      paddingTopLeft: [80, 240], paddingBottomRight: [80, 80], maxZoom: 14, // headroom for the popup under the HUD
    });
  }, (err) => {
    locateBtn.classList.remove('busy');
    document.getElementById('status').textContent =
      '⚠ ' + (err.code === 1 ? 'location permission denied' : 'could not get your location');
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}

/* ================= station click info ================= */
// Clicking anywhere near a station (within ~80 px) opens an info popup for
// the nearest one: name, code, lines served, and live departures.
let stnPopup = null, stnPopupStation = null;
map.on('click', (e) => {
  if (!network) return;
  const pt = map.latLngToContainerPoint(e.latlng);
  let best = null, bestPx = Infinity;
  for (const s of Object.values(network.stations)) {
    const d = pt.distanceTo(map.latLngToContainerPoint([s.lat, s.lon]));
    if (d < bestPx) { bestPx = d; best = s; }
  }
  if (!best || bestPx > 80) return;
  stnPopupStation = best;
  stnPopup = L.popup({ offset: [0, -6] })
    .setLatLng([best.lat, best.lon])
    .setContent(stationPopupHtml(best))
    .openOn(map);
  rememberStation(best.abbr);
});

function stationPopupHtml(s) {
  const colors = new Map();
  for (const r of network.routes) if (r.stations.includes(s.abbr)) colors.set(r.color, r.hexcolor);
  const chips = [...colors.entries()]
    .sort(([a], [b]) => COLOR_ORDER.indexOf(a) - COLOR_ORDER.indexOf(b))
    .map(([c, hex]) => `<span class="popup-line"><i style="background:${hex};color:${hex}"></i>${c}</span>`)
    .join('');
  const youRow = you && you.nearestAbbr === s.abbr
    ? `<div class="popup-you">📍 nearest to you · ${you.km < 1 ? Math.round(you.km * 1000) + ' m' : you.km.toFixed(1) + ' km'} away</div>`
    : '';
  return stationBoard(s, s.abbr) +
    `<div class="popup-lines">${chips || '<span class="board-empty">No lines</span>'}</div>` + youRow;
}

/* ================= station hover board ================= */
let etdByStation = {};
function stationBoard(s, code) {
  const secs = { North: new Map(), South: new Map() };
  for (const etd of etdByStation[s.abbr] || []) {
    for (const est of BartCore.asArray(etd.estimate)) {
      const mins = est.minutes === 'Leaving' ? 0 : Number(est.minutes);
      if (!Number.isFinite(mins) || est.cancelflag === '1' || !secs[est.direction]) continue;
      const key = `${etd.destination}|${est.hexcolor}`;
      if (!secs[est.direction].has(key)) secs[est.direction].set(key, { dest: etd.destination, hex: est.hexcolor, mins: [] });
      secs[est.direction].get(key).mins.push(mins);
    }
  }
  let html = `<div class="board"><div class="board-title">${s.name}` +
    (code ? `<span class="board-code">${code}</span>` : '') + `</div>`;
  let any = false;
  for (const dir of ['North', 'South']) {
    const rows = [...secs[dir].values()].sort((a, b) => Math.min(...a.mins) - Math.min(...b.mins));
    if (!rows.length) continue;
    any = true;
    html += `<div class="board-sec">${dir.toUpperCase()}BOUND</div>`;
    for (const r of rows) {
      const shown = r.mins.sort((a, b) => a - b).slice(0, 3);
      const mins = shown.map(m => m === 0 ? '<b>now</b>' : `<b>${m}</b>`).join(' · ') +
        (shown.some(m => m > 0) ? ' min' : '');
      html += `<div class="board-row"><i style="background:${r.hex};color:${r.hex}"></i>` +
        `<span class="board-dest">${r.dest}</span><span class="board-mins">${mins}</span></div>`;
    }
  }
  if (!any) html += `<div class="board-empty">No trains expected</div>`;
  return html + `</div>`;
}

/* ================= split-flap departures hall ================= */
const FLAPCHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/. ';
const HALL_ROWS = 10, DEST_W = 18;
let hallStation = 'EMBR';
let lastStn = null; // last station the user explicitly viewed (map click or hall pick)
try {
  lastStn = localStorage.getItem('bart-fart-last-stn');
  hallStation = lastStn || localStorage.getItem('bart-fart-hall-stn') || 'EMBR';
} catch (e) {}
function rememberStation(abbr) {
  lastStn = abbr;
  try { localStorage.setItem('bart-fart-last-stn', abbr); } catch (e) {}
}

// Pick the hall's station automatically: the last station the user explicitly
// viewed wins; otherwise the one nearest their location, if we know it.
function hallAutoSelect() {
  if (!network) return;
  const target = lastStn && network.stations[lastStn] ? lastStn
    : you && network.stations[you.nearestAbbr] ? you.nearestAbbr : null;
  if (!target) return;
  hallStation = target;
  const pick = document.getElementById('stn-pick');
  if (pick.options.length) pick.value = target;
}

function buildHall(net) {
  const pick = document.getElementById('stn-pick');
  pick.innerHTML = Object.values(net.stations)
    .sort((a, b) => a.name.localeCompare(b.name))
    .map(s => `<option value="${s.abbr}">${s.name.toUpperCase()}</option>`)
    .join('');
  if (!net.stations[hallStation]) hallStation = 'EMBR';
  pick.value = hallStation;
  pick.onchange = () => {
    hallStation = pick.value;
    rememberStation(hallStation);
    renderHall();
  };

  const cols = document.querySelector('.fcols');
  cols.innerHTML =
    `<span style="width:14px"></span>` +
    `<span style="flex:1">DESTINATION</span>` +
    `<span style="width:96px;text-align:center">DIRECTION</span>` +
    `<span style="width:84px;text-align:center">MIN</span>`;

  const rowsEl = document.getElementById('frows');
  rowsEl.innerHTML = '';
  for (let r = 0; r < HALL_ROWS; r++) {
    const row = document.createElement('div');
    row.className = 'frow';
    row.innerHTML =
      `<span class="fpill"></span>` +
      `<span class="fgroup dest">${'<span class="fcell"> </span>'.repeat(DEST_W)}</span>` +
      `<span class="sp"></span>` +
      `<span class="fdir"></span>` +
      `<span class="fcell fmin"> </span>`;
    rowsEl.appendChild(row);
  }
  setInterval(() => {
    document.getElementById('hall-clock').textContent =
      new Date().toLocaleTimeString([], { hour12: false });
  }, 1000);
}

function setCell(el, text) {
  text = (text || ' ').toUpperCase();
  if (el.dataset.ch === text) return;
  el.dataset.ch = text;
  clearInterval(el._t);
  const scramble = () =>
    Array.from({ length: text.trim().length || 1 }, () => FLAPCHARS[Math.floor(Math.random() * FLAPCHARS.length)]).join('');
  let steps = 2 + Math.floor(Math.random() * 4);
  el._t = setInterval(() => {
    el.classList.remove('flipping');
    void el.offsetWidth;
    el.classList.add('flipping');
    if (--steps <= 0) {
      clearInterval(el._t);
      el.textContent = text;
    } else {
      el.textContent = scramble();
    }
  }, 80 + Math.random() * 50);
}

function setGroup(groupEl, text, width, alignRight) {
  text = text.toUpperCase().slice(0, width);
  text = alignRight ? text.padStart(width) : text.padEnd(width);
  const cells = groupEl.children;
  for (let i = 0; i < width; i++) setCell(cells[i], text[i]);
}

function renderHall() {
  const rows = [];
  for (const etd of etdByStation[hallStation] || []) {
    for (const est of BartCore.asArray(etd.estimate)) {
      const mins = est.minutes === 'Leaving' ? 0 : Number(est.minutes);
      if (!Number.isFinite(mins) || est.cancelflag === '1') continue;
      const dest = etd.destination === 'Pittsburg/Bay Point' ? 'PITTSBURG/BAY PT' : etd.destination;
      rows.push({ dest, hex: est.hexcolor, dir: est.direction[0], mins });
    }
  }
  rows.sort((a, b) => a.mins - b.mins);
  const rowEls = document.querySelectorAll('#frows .frow');
  rowEls.forEach((rowEl, i) => {
    const r = rows[i];
    rowEl.querySelector('.fpill').style.setProperty('--c', r ? r.hex : '#1b2733');
    setGroup(rowEl.querySelector('.dest'), r ? r.dest : '', DEST_W, false);
    rowEl.querySelector('.fdir').textContent = r ? (r.dir === 'N' ? '▲ NORTH' : '▼ SOUTH') : '';
    setCell(rowEl.querySelector('.fmin'), r ? (r.mins === 0 ? 'NOW' : String(r.mins)) : ' ');
  });
}

/* ================= live trains ================= */
function popupHtml(t) {
  const where = t.atStation
    ? `At <b>${t.atStation}</b>`
    : `${t.prevStation} → <b>${t.nextStation}</b> (~${t.minutesToNext} min)`;
  return `<div class="popup-dest"><i style="background:${t.hexcolor};color:${t.hexcolor}"></i>${t.destination}</div>` +
    `<div class="popup-sub">${where}<br>` +
    `${t.cars ? t.cars + ' cars · ' : ''}${t.direction}bound` +
    (t.delayMin > 0 ? ` · <span class="popup-late">${t.delayMin} min late</span>` : '') +
    `</div>`;
}

// A little BART car from above, nose pointing north so rotate(bearing) works:
// silver body, dark windshield, car divider, and a roof stripe in line color.
function trainIconHtml(t) {
  return `<div class="train-zoom"><div class="train-wrap" style="transform:rotate(${t.bearing}deg)">` +
    `<svg class="train-svg" viewBox="0 0 13 30" style="filter:drop-shadow(0 0 5px ${t.hexcolor})">` +
    `<path d="M6.5 .75 C9.8 .75 11.6 2.6 11.6 6.2 L11.6 26.2 Q11.6 29.25 8.6 29.25 L4.4 29.25 Q1.4 29.25 1.4 26.2 L1.4 6.2 C1.4 2.6 3.2 .75 6.5 .75 Z" fill="#e9edf1" stroke="#5c6670" stroke-width="1"/>` +
    `<rect x="5" y="7.4" width="3" height="19.6" rx="1.5" fill="${t.hexcolor}"/>` +
    `<rect x="1.9" y="14.4" width="9.2" height="1" fill="#9aa4ad"/>` +
    `<rect x="3.1" y="2.7" width="6.8" height="2.5" rx="1.2" fill="#242b32"/>` +
    `</svg></div></div>`;
}

function makeMarker(t) {
  const icon = L.divIcon({
    className: 'train-marker',
    iconSize: [13, 30], iconAnchor: [6.5, 15], popupAnchor: [0, -12],
    html: trainIconHtml(t),
  });
  return L.marker([t.lat, t.lon], { icon, zIndexOffset: 500 }).bindPopup(popupHtml(t)).addTo(map);
}

// Markers are matched to the previous refresh's trains (same line + direction,
// nearest position) so they glide to their new spot instead of jumping.
let live = [];
function updateTrains(trains) {
  const unmatched = new Set(live);
  const next = [];
  for (const t of trains) {
    let best = null, bestD = Infinity;
    for (const e of unmatched) {
      if (e.train.color !== t.color || e.train.direction !== t.direction) continue;
      const d = (e.train.lat - t.lat) ** 2 + (e.train.lon - t.lon) ** 2;
      if (d < bestD) { bestD = d; best = e; }
    }
    if (best && bestD < 0.0016) { // ~4 km
      unmatched.delete(best);
      best.train = t;
      best.marker.setLatLng([t.lat, t.lon]);
      const wrap = best.marker._icon && best.marker._icon.querySelector('.train-wrap');
      if (wrap) wrap.style.transform = `rotate(${t.bearing}deg)`;
      best.marker.setPopupContent(popupHtml(t));
      next.push(best);
    } else {
      next.push({ marker: makeMarker(t), train: t });
    }
  }
  for (const e of unmatched) e.marker.remove();
  live = next;

  const counts = {};
  for (const t of trains) {
    counts[t.color] = counts[t.color] || { n: 0, hex: t.hexcolor };
    counts[t.color].n++;
  }
  const lines = document.getElementById('lines');
  lines.hidden = false;
  lines.innerHTML = Object.entries(counts).sort()
    .map(([c, v]) => `<span class="chip"><i style="background:${v.hex};color:${v.hex}"></i>${c} <span>${v.n}</span></span>`)
    .join('');
  const when = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  document.getElementById('status').innerHTML = `<b>${trains.length}</b> trains · ${when}`;
}

/* ================= fart plumes ================= */
// Living up to the name: every train periodically toots a little cloud at its
// current on-screen (mid-glide) position, drifting off behind it.
const MAX_PUFFS = 80;
let puffCount = 0;
function emitPuff(e) {
  const icon = e.marker._icon;
  if (!icon || puffCount >= MAX_PUFFS) return;
  const r = icon.getBoundingClientRect();
  const m = map.getContainer().getBoundingClientRect();
  if (r.right < m.left || r.left > m.right || r.bottom < m.top || r.top > m.bottom) return;
  const ll = map.containerPointToLatLng([r.left + r.width / 2 - m.left, r.top + r.height / 2 - m.top]);
  const rad = e.train.bearing * Math.PI / 180;
  const back = 12 + Math.random() * 10; // px of drift, opposite the nose
  const dx = -Math.sin(rad) * back + (Math.random() - .5) * 8;
  const dy = Math.cos(rad) * back + (Math.random() - .5) * 8 - 4; // plus a little rise
  const scale = 1.1 + Math.random() * .7;
  const rot = Math.round((e.train.bearing + 90) % 360); // bubbles face the train
  const puff = L.marker(ll, {
    icon: L.divIcon({
      className: 'puff-marker', iconSize: [30, 19], iconAnchor: [15, 10],
      html: `<div class="puff" style="--dx:${dx.toFixed(0)}px;--dy:${dy.toFixed(0)}px;--s:${scale.toFixed(2)};--rot:${rot}deg">` +
        `<svg viewBox="-8 -2 42 26">` +
        `<path d="M4 14 A5 5 0 0 1 8 6 A4.5 4.5 0 0 1 16 4 A4.5 4.5 0 0 1 24 6 A5 5 0 0 1 28 14 A4.3 4.3 0 0 1 22 19 A6.5 6.5 0 0 1 10 19 A4.3 4.3 0 0 1 4 14 Z"/>` +
        `<circle cx="-1.5" cy="17" r="2.2"/><circle cx="-5" cy="14" r="1.3"/>` +
        `</svg></div>`,
    }),
    interactive: false, keyboard: false, zIndexOffset: 100,
  }).addTo(map);
  puffCount++;
  setTimeout(() => { puff.remove(); puffCount--; }, 2400);
}
setInterval(() => {
  if (view === 'board' || document.hidden) return;
  for (const e of live) if (Math.random() < .45) emitPuff(e);
}, 900);

/* ================= data loop ================= */
const API_KEY = 'MW9S-E7SL-26DU-VV8V'; // BART's public demo key
const api = BartCore.makeApi(API_KEY);
async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`BART API ${res.status}`);
  return res.json();
}

// The static network data (stations, routes, travel times) changes rarely;
// cache it in localStorage for a day to keep page loads fast.
async function loadNetworkCached() {
  try {
    const c = JSON.parse(localStorage.getItem('bart-fart-network') || 'null');
    if (c && Date.now() - c.at < 24 * 3600 * 1000) return c.network;
  } catch (e) {}
  const net = await BartCore.loadNetwork(getJSON, API_KEY);
  try { localStorage.setItem('bart-fart-network', JSON.stringify({ at: Date.now(), network: net })); } catch (e) {}
  return net;
}

let network = null;
async function refresh() {
  try {
    const data = await getJSON(api('etd', { cmd: 'etd', orig: 'ALL' }));
    etdByStation = {};
    for (const stn of BartCore.asArray(data.root.station)) etdByStation[stn.abbr] = BartCore.asArray(stn.etd);
    updateTrains(BartCore.estimateTrains(network, data.root));
    if (view === 'board') renderHall();
    if (stnPopup && stnPopup.isOpen()) stnPopup.setContent(stationPopupHtml(stnPopupStation));
  } catch (e) {
    document.getElementById('status').textContent = '⚠ could not reach the BART API';
  }
}

(async () => {
  let saved = 'neon';
  try { saved = localStorage.getItem('bart-fart-view') || 'neon'; } catch (e) {}
  applyView(saved);
  network = await loadNetworkCached();
  drawNetwork(network);
  buildHall(network);
  // If the user already granted location, zoom to them without re-prompting.
  try {
    const p = await navigator.permissions?.query({ name: 'geolocation' });
    if (p?.state === 'granted') locate();
  } catch (e) {}
  await refresh();
  document.getElementById('loading').classList.add('done');
  setInterval(refresh, 15000);
})();
</script>
